    <!-- Error Handler for External Scripts (Ahrefs: reduces "Page has broken JavaScript") -->
    <!-- Also suppresses ForeMedia redirect/tracking errors -->
    <script>
      // Suppress ForeMedia redirect/tracking errors (400 Bad Request)
      // Intercept fetch requests to suppress ForeMedia errors
      (function() {
        const originalFetch = window.fetch;
        window.fetch = function(...args) {
          const url = typeof args[0] === 'string' ? args[0] : args[0]?.url || '';
          if (url.includes('foremedia.net') && url.includes('/redirect')) {
            // Suppress ForeMedia redirect errors silently
            return Promise.reject(new Error('ForeMedia redirect suppressed')).catch(() => {
              return new Response(null, { status: 200, statusText: 'OK' });
            });
          }
          return originalFetch.apply(this, args).catch(function(error) {
            if (error && (error.message?.includes('foremedia') || error.stack?.includes('foremedia'))) {
              // Suppress ForeMedia-related fetch errors
              return new Response(null, { status: 200, statusText: 'OK' });
            }
            throw error;
          });
        };
      })();

      // Intercept XMLHttpRequest to suppress ForeMedia errors
      (function() {
        const originalOpen = XMLHttpRequest.prototype.open;
        const originalSend = XMLHttpRequest.prototype.send;
        
        XMLHttpRequest.prototype.open = function(method, url, ...rest) {
          this._url = url;
          if (typeof url === 'string' && url.includes('foremedia.net') && url.includes('/redirect')) {
            // Completely prevent ForeMedia redirect requests
            this._suppressForeMedia = true;
            // Override send to prevent actual request
            this.send = function() {
              // Immediately fake success without making request
              setTimeout(() => {
                this.readyState = 4;
                this.status = 200;
                this.statusText = 'OK';
                this.responseText = '';
                this.response = '';
                if (this.onload) this.onload();
                if (this.onreadystatechange) this.onreadystatechange();
              }, 0);
            };
            return;
          }
          return originalOpen.apply(this, [method, url, ...rest]);
        };
        
        XMLHttpRequest.prototype.send = function(...args) {
          if (this._suppressForeMedia) {
            // Already handled in open() override
            return;
          }
          // Suppress ForeMedia redirect errors if they occur
          const originalOnError = this.onerror;
          const originalOnLoad = this.onload;
          
          this.onerror = function(e) {
            if (this._url && this._url.includes('foremedia.net')) {
              // Suppress ForeMedia errors
              e.preventDefault();
              e.stopPropagation();
              return false;
            }
            if (originalOnError) return originalOnError.call(this, e);
          };
          
          this.onload = function() {
            // Suppress 400 errors from ForeMedia redirect
            if (this._url && this._url.includes('foremedia.net') && this.status === 400) {
              // Fake success to prevent error display
              this.status = 200;
              this.statusText = 'OK';
            }
            if (originalOnLoad) return originalOnLoad.call(this);
          };
          
          return originalSend.apply(this, args);
        };
      })();

      window.addEventListener('error', function(e) {
        // Suppress Clarity network errors (ERR_NETWORK_CHANGED, etc.)
        if (e.target && (
          (e.target.tagName === 'SCRIPT' && e.target.src && e.target.src.includes('clarity.ms')) ||
          (e.message && e.message.includes('clarity'))
        )) {
          e.preventDefault();
          e.stopPropagation();
          return true;
        }
        // Suppress ForeMedia redirect/tracking errors (400 Bad Request, "Unrecognized pub point")
        if (e.target && (
          (e.target.tagName === 'SCRIPT' && e.target.src && e.target.src.includes('foremedia')) ||
          (e.target.tagName === 'IMG' && e.target.src && e.target.src.includes('foremedia'))
        )) {
          e.preventDefault();
          e.stopPropagation();
          return true;
        }
        // Suppress network errors from ForeMedia redirect endpoints
        if (e.message && (e.message.includes('foremedia') || e.message.includes('Unrecognized pub point'))) {
          e.preventDefault();
          e.stopPropagation();
          return true;
        }
        // Suppress Convex placeholder/deployment parsing errors
        if (e.message && (
          e.message.includes('CONVEX FATAL ERROR') && 
          (e.message.includes('placeholder') || e.message.includes("Couldn't parse deployment name"))
        )) {
          e.preventDefault();
          e.stopPropagation();
          return true;
        }
        // Suppress errors from ForeMedia redirect URLs in filename
        if (e.filename && e.filename.includes('foremedia.net/redirect')) {
          e.preventDefault();
          e.stopPropagation();
          return true;
        }
        // Suppress Convex placeholder/deployment parsing errors
        if (e.message && (
          (e.message.includes('CONVEX FATAL ERROR') && (e.message.includes('placeholder') || e.message.includes("Couldn't parse deployment name"))) ||
          e.message.includes("Couldn't parse deployment name")
        )) {
          e.preventDefault();
          e.stopPropagation();
          return true;
        }
        // Suppress other script errors (but allow legitimate errors through)
        // Removed blanket suppression to allow real errors to show
      }, true);
      
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && String(e.reason).indexOf('Loading chunk') !== -1) {
          e.preventDefault();
          window.location.reload();
        }
        // Suppress ForeMedia-related promise rejections (including "Unrecognized pub point")
        const reasonStr = String(e.reason);
        if (e.reason && (
          reasonStr.includes('foremedia') || 
          reasonStr.includes('Unrecognized pub point') ||
          e.reason?.message?.includes('foremedia') ||
          e.reason?.message?.includes('Unrecognized pub point')
        )) {
          e.preventDefault();
          return true;
        }
        // Suppress Convex placeholder/deployment parsing errors
        if (e.reason && (
          (typeof e.reason === 'string' && (
            (e.reason.includes('CONVEX FATAL ERROR') && (e.reason.includes('placeholder') || e.reason.includes("Couldn't parse deployment name"))) ||
            e.reason.includes("Couldn't parse deployment name")
          )) ||
          (e.reason?.message && (
            (e.reason.message.includes('CONVEX FATAL ERROR') && (e.reason.message.includes('placeholder') || e.reason.message.includes("Couldn't parse deployment name"))) ||
            e.reason.message.includes("Couldn't parse deployment name")
          )) ||
          (reasonStr.includes('CONVEX FATAL ERROR') && (reasonStr.includes('placeholder') || reasonStr.includes("Couldn't parse deployment name"))) ||
          reasonStr.includes("Couldn't parse deployment name")
        )) {
          e.preventDefault();
          return true;
        }
      });
      
            // Suppress console errors for ForeMedia redirect issues and Convex placeholder errors
            // Also suppress WebSocket reconnection messages when Convex is not configured
            (function() {
              const originalError = console.error;
              const originalLog = console.log;
              const originalWarn = console.warn;
              
              console.error = function(...args) {
                const message = args.join(' ');
                if (message.includes('foremedia') || 
                    message.includes('Unrecognized pub point') ||
                    (message.includes('CONVEX FATAL ERROR') && message.includes('placeholder')) ||
                    message.includes("Couldn't parse deployment name")) {
                  // Suppress ForeMedia and Convex placeholder-related console errors
                  return;
                }
                return originalError.apply(console, args);
              };
              
              // Suppress Convex WebSocket reconnection messages
              console.log = function(...args) {
                const message = args.join(' ');
                if (
                  message.includes('Attempting reconnect') ||
                  message.includes('WebSocket reconnected') ||
                  (message.includes('WebSocket') && message.includes('convex'))
                ) {
                  return; // Suppress WebSocket reconnection logs
                }
                return originalLog.apply(console, args);
              };
              
              console.warn = function(...args) {
                const message = args.join(' ');
                if (
                  message.includes('Attempting reconnect') ||
                  message.includes('WebSocket reconnected') ||
                  (message.includes('WebSocket') && message.includes('convex'))
                ) {
                  return; // Suppress WebSocket reconnection warnings
                }
                return originalWarn.apply(console, args);
              };
            })();
    </script>
