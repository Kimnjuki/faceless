# Nginx configuration for Coolify deployment
# Note: Coolify handles SSL/TLS termination externally, so this container only serves HTTP on port 80
#
# ⚠️ CANONICAL-HOST INVARIANT (CRIT-001): https://contentanonymity.com/ MUST return 200 through
# the whole stack and delete any edge redirect that matches the canonical host itself.
# Live verification on 2026-09-05 found https://contentanonymity.com/ returning 301 -> itself
# at the Cloudflare edge (Server: cloudflare). That rule must be removed in the Cloudflare
# dashboard; this file must NEVER redirect the canonical host. Every other variant may only
# 301 to the canonical URL in a single hop:
#   http(s)://www.contentanonymity.com/  ->  301  ->  https://contentanonymity.com/
#   http://contentanonymity.com/         ->  301  ->  https://contentanonymity.com/
#   https://contentanonymity.com/        ->  200  (serve index.html, no redirect)
#
# Guard script: node scripts/verify-canonical.mjs  (fails CI on any loop / non-200 canonical)

# Canonical host enforcement (P0-01 / P2-01):
# The 2026-09-01 Ahrefs/GSC audit found BOTH www.contentanonymity.com and
# contentanonymity.com serving identical 200 pages, which is the single root
# cause of the duplicate-content / indexing-collapse issues. The www host must
# be collapsed into the canonical non-www host with a SINGLE 301 hop.
# Coolify still terminates TLS, but this container now enforces the host split
# itself so the canonicalization works regardless of external proxy settings.
#
# Chain verified:  http(s)://www.contentanonymity.com/...  ->  https://contentanonymity.com/...  (1 hop)

# --- Canonical host: www -> non-www (single-hop 301) ---
# Place this server block BEFORE the catch-all so nginx picks it for the www host.
server {
    listen 80;
    server_name www.contentanonymity.com;
    # Single hop redirect straight to the canonical (non-www) HTTPS host.
    return 301 https://contentanonymity.com$request_uri;
}

server {
    listen 80;
    # Canonical host + any other hostname (Coolify handles routing on the edge).
    # The canonical host MUST always fall through to static serving (200) and
    # NEVER self-redirect (CRIT-001 loop guard).
    server_name contentanonymity.com _;
    
    # Hide server version
    server_tokens off;
    
    # Charset
    charset utf-8;
    
    # Root directory
    root /usr/share/nginx/html;
    index index.html;
    
    # Gzip compression - Enhanced for JavaScript
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/javascript 
        application/x-javascript 
        application/json 
        application/xml 
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;
    
    # Browser caching for static assets - long cache for immutable assets
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    
    # CSS and JS with hash - can cache long with compression
    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip_static on;
    }
    
    # HTML files - short cache with revalidation
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }
    
    # robots.txt - must return 200 with text/plain (Ahrefs "Robots.txt is not accessible")
    location = /robots.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    # sitemap.xml - must return 200 with application/xml
    location = /sitemap.xml {
        root /usr/share/nginx/html;
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
    }

    # Note: Trailing slash redirect removed to prevent redirect loops
    # React Router handles routing, so trailing slashes are fine

    # Main location - SPA routing
    # P1-01 path-level 301 redirects (generated from redirects.config.json). The file
    # is always present (scripts/populate-redirects.mjs writes an empty header), so
    # this include is safe even when no redirects are configured yet.
    include /etc/nginx/conf.d/redirects.conf;

    # Prevent redirect loops by only trying index.html if file doesn't exist
    location / {
        try_files $uri /index.html;
        
        # Security Headers inside location block to avoid nginx inheritance gotcha
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://pagead2.googlesyndication.com https://analytics.ahrefs.com https://static.foremedia.net https://platform.foremedia.net https://securepubads.g.doubleclick.net https://fundingchoicesmessages.google.com https://mc.yandex.ru https://*.convex.cloud https://*.convex.site; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co https://*.convex.cloud https://*.convex.site https://www.google-analytics.com https://analytics.ahrefs.com https://static.foremedia.net https://platform.foremedia.net https://securepubads.g.doubleclick.net https://mc.yandex.ru; frame-src 'self' https://www.google.com https://securepubads.g.doubleclick.net; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    }
    
    # Security: Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Health check endpoint (for Coolify)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    

}
